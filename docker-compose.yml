version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: flash-postgres
    restart: always

    environment:
      POSTGRES_USER: flashuser
      POSTGRES_PASSWORD: ASDASDSA55WQ8R563DG9Y6T2QW5E5Q
      POSTGRES_DB: flashapi

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: flash-redis
    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: ["redis-server", "--appendonly", "yes"]

  flash-api:
    image: flashconect/flash-api:v1.0.6
    container_name: flash-api
    restart: always

    depends_on:
      - postgres
      - redis

    ports:
      - "3000:3000"

    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PROTOCOLO: http

      NODE_ENV: production

      LOG_LEVEL: info
      WA_LOG_LEVEL: error

      TZ: America/Sao_Paulo

      SYNC_SESSIONS: "true"

      CORS_ORIGINS: "*"

      MANAGER: "true"
      LOGIN_MANAGER_ADMIN: admin
      LOGIN_MANAGER_USER: user
      SENHA_MANAGER_ADMIN: admin123

      SESSION_PHONE_CLIENT: FlashApi
      SESSION_PHONE_NAME: Chrome

      GLOBAL_API_KEY: ASDASDSA55WQ88E55R8ER5T2QW5E5Q

      ENABLE_GLOBAL_WEBHOOK: "false"
      GLOBAL_WEBHOOK_URL: https://your-webhook-url.com/webhook
      GLOBAL_WEBHOOK_ATTEMPTS: 4

      GLOBAL_WEBHOOK_EVENTS: "connection_update,creds_update,messaging_history_set,messaging_history_status,chats_upsert,chats_update,lid_mapping_update,chats_delete,presence_update,contacts_upsert,contacts_update,messages_delete,messages_update,messages_media_update,messages_upsert,messages_reaction,message_receipt_update,groups_upsert,groups_update,group_participants_update,group_join_request,group_member_tag_update,blocklist_set,blocklist_update,call,labels_edit,labels_association,newsletter_reaction,newsletter_view,newsletter_participants_update,newsletter_settings_update,message_capping_update,chats_lock,settings_update"

      ENABLE_WEBSOCKET: "false"
      GLOBAL_WEBSOCKET_SECRET: ASDASDSA55WQ8R563DG9Y6T2QW5E5Q

      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: flashuser
      DB_PASSWORD: ASDASDSA55WQ8R563DG9Y6T2QW5E5Q
      DB_DATABASE: flashapi

      DB_CONNECTION_LIMIT: 10
      QUEUELIMIT: 0

      LIMITE_QRCODE: 10

      DELETE_SESAO_DISCONECT: "true"
      TEMP_DELETE_SESSAO: 5

      PROXY_STATE: "false"

      # Redis (ativado)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # REDIS_PASS:

volumes:
  postgres_data:
  redis_data:
